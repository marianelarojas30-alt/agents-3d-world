name: preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m py_compile server.py
      - run: node --check world.js
      - name: Verify localhost boundary
        shell: bash
        run: |
          python server.py >server-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8737/ >/dev/null && break
            sleep 0.25
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:8737/)" = "403"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8737/ | grep -qi '^Content-Security-Policy:'
